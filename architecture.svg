<rect x="30" y="160" width="420" height="80" rx="10" fill="white" stroke="#9baebe"/><text x="240.0" y="190" text-anchor="middle" font-family="Arial" font-size="18" fill="#112b44">DuckDB raw → dbt staging → marts</text><text x="240.0" y="217" text-anchor="middle" font-family="Arial" font-size="13" fill="#415c71">Review cleaning + separately aggregated sales</text><rect x="550" y="160" width="420" height="80" rx="10" fill="white" stroke="#9baebe"/><text x="760.0" y="190" text-anchor="middle" font-family="Arial" font-size="18" fill="#112b44">Bounded queue → live / microbatch</text><text x="760.0" y="217" text-anchor="middle" font-family="Arial" font-size="13" fill="#415c71">Collection size or timer; preserve source order</text><rect x="30" y="290" width="420" height="80" rx="10" fill="white" stroke="#9baebe"/><text x="240.0" y="320" text-anchor="middle" font-family="Arial" font-size="18" fill="#112b44">Prepared immutable Batch store</text><text x="240.0" y="347" text-anchor="middle" font-family="Arial" font-size="13" fill="#415c71">Paid revenue in ILS; reviews and product metrics</text><rect x="550" y="290" width="420" height="80" rx="10" fill="white" stroke="#9baebe"/><text x="760.0" y="320" text-anchor="middle" font-family="Arial" font-size="18" fill="#112b44">Course StreamEngine → SQLite WAL</text><text x="760.0" y="347" text-anchor="middle" font-family="Arial" font-size="13" fill="#415c71">One transaction per event: state + checkpoint</text><rect x="230" y="430" width="540" height="90" rx="10" fill="white" stroke="#9baebe"/><text x="500.0" y="460" text-anchor="middle" font-family="Arial" font-size="18" fill="#112b44">Python evidence snapshot for one question</text><text x="500.0" y="487" text-anchor="middle" font-family="Arial" font-size="13" fill="#415c71">SQLite read transaction includes checkpoint + watermark</text><rect x="100" y="590" width="330" height="90" rx="10" fill="white" stroke="#9baebe"/><text x="265.0" y="620" text-anchor="middle" font-family="Arial" font-size="18" fill="#112b44">Actor → Hebrew draft</text><text x="265.0" y="647" text-anchor="middle" font-family="Arial" font-size="13" fill="#415c71">Same frozen evidence for every retry</text><rect x="570" y="590" width="330" height="90" rx="10" fill="white" stroke="#9baebe"/><text x="735.0" y="620" text-anchor="middle" font-family="Arial" font-size="18" fill="#112b44">Critic → strict Evaluation</text><text x="735.0" y="647" text-anchor="middle" font-family="Arial" font-size="13" fill="#415c71">Approve or feedback; at most three attempts</text><rect x="100" y="750" width="330" height="80" rx="10" fill="white" stroke="#9baebe"/><text x="265.0" y="780" text-anchor="middle" font-family="Arial" font-size="18" fill="#112b44">Approved answer → Gradio history</text><text x="265.0" y="807" text-anchor="middle" font-family="Arial" font-size="13" fill="#415c71">Snapshot ID, source, units and data time</text><rect x="570" y="750" width="330" height="80" rx="10" fill="white" stroke="#9baebe"/><text x="735.0" y="780" text-anchor="middle" font-family="Arial" font-size="18" fill="#112b44">Separate audit log</text><text x="735.0" y="807" text-anchor="middle" font-family="Arial" font-size="13" fill="#415c71">Evidence + all drafts + decisions + errors</text><text x="500" y="655" text-anchor="middle" font-family="Arial" font-size="12">reject / feedback</text></svg>